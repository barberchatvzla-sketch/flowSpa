<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#E000E0">
    <title>Glow Admin Portal</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
     
    <link rel="manifest" href="manifest.json">

    <style>
        /* --- 1. VARIABLES & RESET IOS STYLE --- */
        :root {
            --ios-bg: #F2F2F7;         
            --ios-card: #FFFFFF;       
            --ios-text: #000000;       
            --ios-text-sec: #8E8E93;   
            --ios-accent: #E000E0;
            --ios-blue: #007AFF;
            --ios-green: #34C759;
            --ios-red: #FF3B30;
            --ios-orange: #FF9500;
            --shadow: 0 4px 20px rgba(0,0,0,0.08);
            --radius: 16px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; padding: 0;
            font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--ios-bg);
            color: var(--ios-text);
            height: 100vh;
            overflow: hidden; 
        }

        /* --- 2. LOGIN SCREEN --- */
        #loginScreen {
            position: fixed; inset: 0; z-index: 9999;
            background: #fff;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 2rem;
            transition: opacity 0.5s;
        }
        .login-logo { width: 80px; height: 80px; background: var(--ios-accent); border-radius: 20px; margin-bottom: 2rem; }
        .login-input {
            width: 100%; max-width: 300px;
            padding: 16px; background: #F2F2F7; border: none; border-radius: 12px;
            font-size: 16px; margin-bottom: 1rem; outline: none; text-align: center;
        }
        .login-btn {
            background: var(--ios-accent); color: white; padding: 16px 40px;
            border-radius: 30px; border: none; font-weight: 700; font-size: 16px;
            cursor: pointer; box-shadow: 0 4px 15px rgba(224,0,224,0.3);
        }

        /* --- 3. MAIN LAYOUT --- */
        #app { display: none; height: 100%; flex-direction: column; }
        
        header {
            padding: 50px 20px 10px 20px; background: #fff;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 1px 0 rgba(0,0,0,0.05);
        }
        h1 { margin: 0; font-family: 'Playfair Display', serif; font-size: 28px; }
        
        main { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 100px; }

        /* --- 4. DASHBOARD CARDS --- */
        .grid-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .stat-card {
            background: #fff; padding: 20px; border-radius: var(--radius);
            box-shadow: var(--shadow); text-align: center;
        }
        .stat-num { font-size: 32px; font-weight: 800; display: block; margin-bottom: 5px; }
        .stat-label { font-size: 13px; color: var(--ios-text-sec); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .c-orange { color: var(--ios-orange); }
        .c-green { color: var(--ios-green); }

        /* --- 5. LIST & FILTERS --- */
        .filter-scroll {
            display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; margin-bottom: 15px;
            -webkit-overflow-scrolling: touch;
        }
        .chip {
            padding: 8px 16px; background: #fff; border-radius: 20px;
            font-size: 14px; font-weight: 600; color: var(--ios-text-sec);
            white-space: nowrap; border: 1px solid transparent;
            transition: all 0.2s;
        }
        .chip.active { background: var(--ios-text); color: #fff; }

        .reserva-card {
            background: #fff; border-radius: var(--radius); padding: 16px;
            margin-bottom: 12px; box-shadow: var(--shadow);
            display: flex; justify-content: space-between; align-items: center;
            animation: slideIn 0.3s ease;
        }
        .r-info h3 { margin: 0 0 4px 0; font-size: 16px; }
        .r-info p { margin: 0; font-size: 14px; color: var(--ios-text-sec); }
        .r-time { 
            text-align: right; font-weight: 700; font-size: 15px; 
            background: #F2F2F7; padding: 6px 12px; border-radius: 8px;
        }

        /* --- 6. BOTTOM NAV --- */
        nav {
            position: fixed; bottom: 0; width: 100%; background: rgba(255,255,255,0.9);
            backdrop-filter: blur(10px); border-top: 1px solid rgba(0,0,0,0.1);
            display: flex; justify-content: space-around; padding: 15px 0 25px 0;
            z-index: 100;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center;
            color: #C7C7CC; font-size: 10px; font-weight: 600; gap: 4px;
        }
        .nav-item i { font-size: 24px; }
        .nav-item.active { color: var(--ios-accent); }
        
        /* Notificación Badge en Nav */
        .nav-badge {
            position: absolute; top: -2px; right: -5px;
            background: var(--ios-red); color: white;
            width: 16px; height: 16px; border-radius: 50%;
            font-size: 10px; display: flex; align-items: center; justify-content: center;
            display: none;
        }

        /* --- 7. TOAST NOTIFICATIONS --- */
        #toastArea {
            position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
            z-index: 10000; width: 90%; max-width: 400px;
        }
        .toast {
            background: rgba(0,0,0,0.85); color: white;
            padding: 12px 16px; border-radius: 30px;
            display: flex; align-items: center; gap: 10px;
            margin-bottom: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            animation: dropIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        /* --- 8. CHAT STYLES --- */
        #chatView { display: none; height: 100%; flex-direction: column; }
        .chat-list-item {
            padding: 15px; border-bottom: 1px solid #eee; background: white;
            display: flex; justify-content: space-between; align-items: center;
        }
        .unread-dot { width: 10px; height: 10px; background: var(--ios-accent); border-radius: 50%; }
        
        .chat-room { 
            position: fixed; inset: 0; background: #fff; z-index: 200; 
            display: flex; flex-direction: column; transform: translateX(100%); transition: transform 0.3s;
        }
        .chat-room.open { transform: translateX(0); }
        .chat-header { padding: 50px 20px 15px; background: #f8f8f8; border-bottom: 1px solid #ddd; display: flex; gap: 10px; align-items: center; }
        .chat-msgs { flex: 1; padding: 20px; overflow-y: auto; background: #f0f0f0; display: flex; flex-direction: column; gap: 10px; }
        .bubble { max-width: 75%; padding: 10px 15px; border-radius: 18px; font-size: 15px; line-height: 1.4; position: relative; }
        .bubble.me { align-self: flex-end; background: var(--ios-accent); color: white; border-bottom-right-radius: 4px; }
        .bubble.you { align-self: flex-start; background: white; color: black; border-bottom-left-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .chat-input-area { padding: 15px; background: white; border-top: 1px solid #eee; display: flex; gap: 10px; padding-bottom: 30px; }
        
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes dropIn { from { transform: translateY(-50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* Helpers */
        .hidden { display: none !important; }
        
        /* Toggle Push Button */
        .push-btn {
            background: #eee; border: none; padding: 8px 15px; border-radius: 20px; font-size: 12px;
            display: flex; align-items: center; gap: 5px;
        }
        .push-btn.active { background: #E0E0E0; color: #555; }
        .push-btn i { font-size: 16px; }

    </style>
</head>
<body>

    <div id="loginScreen">
        <div class="login-logo"></div>
        <h2 style="margin-bottom: 10px;">Glow Admin</h2>
        <p style="margin-bottom: 30px; color: #888;">Ingresa tu código de negocio</p>
        <input type="number" id="codeIn" class="login-input" placeholder="Ej: 1001">
        <button onclick="admin.login()" class="login-btn">Entrar al Portal</button>
    </div>

    <div id="toastArea"></div>

    <div id="app">
        <header>
            <div>
                <p style="margin:0; font-size:12px; color:#888;">Bienvenido de nuevo</p>
                <h1 id="bizTitle">Mi Negocio</h1>
            </div>
            <button id="btnPush" class="push-btn" onclick="admin.enablePush()">
                <i class="ph ph-bell"></i> <span>Activar</span>
            </button>
        </header>

        <main id="mainContent">
            
            <div id="listView">
                <div class="grid-stats">
                    <div class="stat-card">
                        <span class="stat-num c-orange" id="cStatPending">0</span>
                        <span class="stat-label">Pendientes</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-num c-green" id="cStatConfirmed">0</span>
                        <span class="stat-label">Confirmadas</span>
                    </div>
                </div>

                <div class="filter-scroll">
                    <div class="chip active" onclick="admin.filter('all', this)">Todas</div>
                    <div class="chip" onclick="admin.filter('pendiente', this)">Pendientes</div>
                    <div class="chip" onclick="admin.filter('confirmada', this)">Confirmadas</div>
                </div>

                <div id="reservasList">
                    </div>
            </div>
            
            <div id="chatViewList" class="hidden">
                <h2 style="padding: 0 20px;">Mensajes</h2>
                <div id="conversationsContainer"></div>
            </div>

        </main>

        <nav>
            <div class="nav-item active" onclick="admin.nav('home', this)">
                <i class="ph-fill ph-house"></i>
                <span>Inicio</span>
            </div>
            <div class="nav-item" style="position: relative;" onclick="admin.nav('chat', this)">
                <i class="ph-fill ph-chat-circle-dots"></i>
                <div id="msgNotify" class="nav-badge">!</div>
                <span>Mensajes</span>
            </div>
            <div class="nav-item" onclick="admin.nav('calendar', this)">
                <i class="ph-fill ph-calendar"></i>
                <span>Agenda</span>
            </div>
        </nav>
    </div>

    <div id="chatRoom" class="chat-room">
        <div class="chat-header">
            <i class="ph ph-arrow-left" style="font-size: 24px;" onclick="adminChat.close()"></i>
            <h3 id="chatTitleName" style="margin:0;">Cliente</h3>
        </div>
        <div id="chatMsgs" class="chat-msgs"></div>
        <div class="chat-input-area">
            <input type="text" id="chatInputAdmin" placeholder="Escribir mensaje..." style="flex:1; padding:10px; border:1px solid #ddd; border-radius:20px;">
            <button onclick="adminChat.send()" style="background:var(--ios-accent); color:white; border:none; width:40px; height:40px; border-radius:50%;"><i class="ph ph-paper-plane-right"></i></button>
        </div>
    </div>

    <script>
        // --- 1. CONFIGURACIÓN SUPABASE ---
        // Asegúrate de colocar tus credenciales aquí si no las cargas externamente
        const SUPABASE_URL = 'TU_URL_AQUI'; 
        const SUPABASE_KEY = 'TU_API_KEY_AQUI';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // --- 2. SISTEMA DE NOTIFICACIONES TOAST ---
        const notifications = {
            show(title, body, type='info') {
                const area = document.getElementById('toastArea');
                const div = document.createElement('div');
                div.className = 'toast';
                
                let icon = 'ph-info';
                if(type === 'reserva') icon = 'ph-calendar-plus';
                if(type === 'mensaje') icon = 'ph-chat-circle-text';
                
                div.innerHTML = `<i class="ph ${icon}" style="font-size:20px; color:#E000E0;"></i> 
                                 <div><div style="font-weight:700; font-size:13px;">${title}</div>
                                 <div style="font-size:12px; opacity:0.8;">${body}</div></div>`;
                
                area.appendChild(div);
                
                // Vibración
                if(navigator.vibrate) navigator.vibrate(200);

                // Sonido suave (opcional)
                // const audio = new Audio('notification.mp3'); audio.play().catch(e=>{});

                setTimeout(() => {
                    div.style.opacity = '0';
                    div.style.transform = 'translateY(-20px)';
                    setTimeout(() => div.remove(), 300);
                }, 4000);
            }
        };

        // --- 3. LÓGICA DE CHAT ---
        const adminChat = {
            conversations: {},
            activePhone: null,
            realtimeChannel: null,

            init() {
                // Se inicia tras el login
            },

            // --- CORRECCIÓN REALTIME CHAT ---
            subscribe() {
                if (this.realtimeChannel) supabaseClient.removeChannel(this.realtimeChannel);
                
                // Usamos un ID único para evitar cache de conexión
                const channelId = `admin_chat_global_${Math.random()}`;
                
                console.log("🔌 Conectando Chat Realtime...");
                
                this.realtimeChannel = supabaseClient.channel(channelId)
                    .on('postgres_changes', { 
                        event: 'INSERT', 
                        schema: 'public', 
                        table: 'mensajes'
                        // SIN FILTROS AQUÍ PARA EVITAR ERRORES DE TIPO
                    }, payload => {
                        const m = payload.new;
                        
                        // --- FILTRO CLIENTE: SEGURIDAD ---
                        // Solo procesar si pertenece a este negocio
                        if (String(m.codigo_negocio) !== String(admin.code)) return;

                        console.log("💬 Mensaje recibido:", m);

                        // Actualizar estructura de datos local
                        if(!this.conversations[m.telefono_cliente]) {
                            this.conversations[m.telefono_cliente] = { msgs: [], last: '', unread: false };
                        }
                        
                        this.conversations[m.telefono_cliente].msgs.push(m);
                        this.conversations[m.telefono_cliente].last = m.contenido;
                        
                        // Si es del cliente
                        if(m.emisor === 'cliente') {
                            if(this.activePhone === m.telefono_cliente) { 
                                // Si el chat está abierto, renderizar
                                this.renderBubble(m); 
                                this.scroll(); 
                            } else { 
                                // Si no, marcar no leído y notificar
                                this.conversations[m.telefono_cliente].unread = true; 
                                document.getElementById('msgNotify').style.display = 'flex';
                                notifications.show('Nuevo Mensaje', `De: ${m.telefono_cliente}`, 'mensaje');
                            }
                        } else if(this.activePhone === m.telefono_cliente) { 
                            // Si yo lo envié (desde otro dispositivo)
                            this.renderBubble(m); 
                            this.scroll(); 
                        }
                        
                        this.renderList();
                    })
                    .subscribe();
            },

            async loadConversations() {
                // Cargar historial
                const { data, error } = await supabaseClient
                    .from('mensajes')
                    .select('*')
                    .eq('codigo_negocio', admin.code)
                    .order('created_at', { ascending: true });
                
                if(data) {
                    data.forEach(m => {
                        if(!this.conversations[m.telefono_cliente]) {
                            this.conversations[m.telefono_cliente] = { msgs: [], last: '', unread: !m.leido && m.emisor === 'cliente' };
                        }
                        this.conversations[m.telefono_cliente].msgs.push(m);
                        this.conversations[m.telefono_cliente].last = m.contenido;
                    });
                    this.renderList();
                }
            },

            renderList() {
                const container = document.getElementById('conversationsContainer');
                container.innerHTML = '';
                
                Object.keys(this.conversations).forEach(phone => {
                    const conv = this.conversations[phone];
                    const div = document.createElement('div');
                    div.className = 'chat-list-item';
                    div.onclick = () => this.open(phone);
                    div.innerHTML = `
                        <div>
                            <div style="font-weight:700;">${phone}</div>
                            <div style="font-size:13px; color:#888; margin-top:4px;">${conv.last.substring(0,30)}...</div>
                        </div>
                        ${conv.unread ? '<div class="unread-dot"></div>' : '<i class="ph ph-caret-right" style="color:#ccc;"></i>'}
                    `;
                    container.appendChild(div);
                });
            },

            open(phone) {
                this.activePhone = phone;
                this.conversations[phone].unread = false;
                this.renderList(); // Quitar punto rojo
                
                document.getElementById('chatTitleName').innerText = phone;
                document.getElementById('chatMsgs').innerHTML = '';
                
                // Renderizar históricos
                this.conversations[phone].msgs.forEach(m => this.renderBubble(m));
                
                document.getElementById('chatRoom').classList.add('open');
                this.scroll();
            },

            close() {
                document.getElementById('chatRoom').classList.remove('open');
                this.activePhone = null;
            },

            renderBubble(msg) {
                const div = document.createElement('div');
                div.className = `bubble ${msg.emisor === 'cliente' ? 'you' : 'me'}`;
                div.textContent = msg.contenido;
                document.getElementById('chatMsgs').appendChild(div);
            },

            async send() {
                const input = document.getElementById('chatInputAdmin');
                const txt = input.value.trim();
                if(!txt || !this.activePhone) return;

                input.value = '';
                
                // Insertar en Supabase (El trigger realtime actualizará la UI)
                await supabaseClient.from('mensajes').insert({
                    codigo_negocio: admin.code,
                    telefono_cliente: this.activePhone,
                    emisor: 'negocio',
                    contenido: txt,
                    leido: true
                });
            },

            scroll() {
                setTimeout(() => {
                    const d = document.getElementById('chatMsgs');
                    d.scrollTop = d.scrollHeight;
                }, 100);
            }
        };

        // --- 4. LÓGICA PRINCIPAL (ADMIN) ---
        const admin = {
            code: null,
            data: [],
            currentFilter: 'all',
            realtimeChannel: null,
            swRegistration: null,
            btn: document.getElementById('btnPush'),

            async init() {
                // Verificar sesión guardada
                const savedCode = localStorage.getItem('glow_admin_code');
                if (savedCode) {
                    document.getElementById('codeIn').value = savedCode;
                    this.login();
                }

                // Registrar Service Worker para PUSH
                if ('serviceWorker' in navigator) {
                    try {
                        this.swRegistration = await navigator.serviceWorker.register('sw.js');
                        console.log('SW Registrado');
                        this.updateBtnUI();
                    } catch (err) { console.error('SW Error', err); }
                }
            },

            async login() {
                const code = document.getElementById('codeIn').value;
                if (!code) return alert("Ingresa código");

                this.code = parseInt(code); // Asegurar número, pero usaremos String para comparar
                
                // Simulación de Auth básica
                const { data, error } = await supabaseClient
                    .from('negocios')
                    .select('*')
                    .eq('codigo', this.code)
                    .single();

                if (error || !data) return alert("Código no encontrado");

                // ÉXITO
                localStorage.setItem('glow_admin_code', this.code);
                document.getElementById('loginScreen').style.opacity = '0';
                setTimeout(() => document.getElementById('loginScreen').style.display = 'none', 500);
                document.getElementById('app').style.display = 'flex';
                document.getElementById('bizTitle').textContent = data.nombre;

                // Cargar datos
                await this.loadData();
                this.subscribe(); // Iniciar Realtime Reservas
                
                // Iniciar Chat
                adminChat.loadConversations();
                adminChat.subscribe();
            },

            async loadData() {
                const { data, error } = await supabaseClient
                    .from('reservas')
                    .select('*')
                    .eq('codigo_negocio', this.code)
                    .order('created_at', { ascending: false });

                if (data) {
                    this.data = data;
                    this.updateStatsUI();
                    this.renderList();
                }
            },

            // --- CORRECCIÓN REALTIME RESERVAS ---
            subscribe() {
                if (this.realtimeChannel) {
                    supabaseClient.removeChannel(this.realtimeChannel);
                }

                const channelId = `admin_reserva_global_${Math.random()}`;
                console.log("🔌 Escuchando reservas...", channelId);

                this.realtimeChannel = supabaseClient.channel(channelId)
                    .on('postgres_changes', { 
                        event: '*',            // INSERT, UPDATE, DELETE
                        schema: 'public', 
                        table: 'reservas'      
                        // SIN FILTROS DE SERVIDOR
                    }, payload => {
                        
                        // FILTRO CLIENTE: Convertir a String para evitar errores de tipo
                        const record = payload.new || payload.old;
                        if (!record || String(record.codigo_negocio) !== String(this.code)) return;

                        console.log('🔥 EVENTO RESERVA:', payload.eventType);

                        // 1. INSERT
                        if (payload.eventType === 'INSERT') {
                            this.data.unshift(payload.new);
                            notifications.show('Nueva Reserva', `${payload.new.nombre} - ${payload.new.hora}`, 'reserva');
                        } 
                        // 2. UPDATE
                        else if (payload.eventType === 'UPDATE') {
                            const index = this.data.findIndex(r => r.id === payload.new.id);
                            if (index !== -1) {
                                this.data[index] = payload.new;
                                // Solo notificar si cambió el estado y no estamos viéndolo
                                notifications.show('Actualización', `Reserva modificada`, 'info');
                            }
                        }
                        // 3. DELETE
                        else if (payload.eventType === 'DELETE') {
                            this.data = this.data.filter(r => r.id !== payload.old.id);
                        }

                        // Actualizar toda la interfaz
                        this.updateStatsUI();
                        this.renderList();
                    })
                    .subscribe((status) => {
                        console.log("Estado Realtime:", status);
                    });
            },

            updateStatsUI() {
                try {
                    const pending = this.data.filter(r => r.estado === 'pendiente').length;
                    const confirmed = this.data.filter(r => r.estado === 'confirmada').length;
                    document.getElementById('cStatPending').textContent = pending;
                    document.getElementById('cStatConfirmed').textContent = confirmed;
                } catch(e) {}
            },

            renderList() {
                const list = document.getElementById('reservasList');
                list.innerHTML = '';

                let filtered = this.data;
                if (this.currentFilter !== 'all') {
                    filtered = this.data.filter(r => r.estado === this.currentFilter);
                }

                if(filtered.length === 0) {
                    list.innerHTML = '<div style="text-align:center; padding:40px; color:#aaa;">No hay reservas</div>';
                    return;
                }

                filtered.forEach(r => {
                    const div = document.createElement('div');
                    div.className = 'reserva-card';
                    // Indicador de color según estado
                    const borderLeft = r.estado === 'pendiente' ? '4px solid var(--ios-orange)' : '4px solid var(--ios-green)';
                    div.style.borderLeft = borderLeft;

                    div.innerHTML = `
                        <div class="r-info">
                            <h3>${r.nombre} ${r.apellido || ''}</h3>
                            <p>${r.servicio}</p>
                            <div style="margin-top:5px; font-size:12px; display:flex; gap:10px;">
                                <span>📞 ${r.telefono}</span>
                                <span style="text-transform:capitalize; font-weight:600; color:${r.estado==='pendiente'?'var(--ios-orange)':'var(--ios-green)'}">${r.estado}</span>
                            </div>
                        </div>
                        <div class="r-time">
                            <div style="color:var(--ios-accent)">${r.hora}</div>
                            <div style="font-size:11px; font-weight:400; color:#888;">${r.fecha}</div>
                        </div>
                    `;
                    
                    // Acción simple: Al hacer click cambiar estado (demo)
                    div.onclick = () => this.toggleStatus(r);
                    
                    list.appendChild(div);
                });
            },

            async toggleStatus(reserva) {
                const nuevoEstado = reserva.estado === 'pendiente' ? 'confirmada' : 'pendiente';
                if(!confirm(`¿Cambiar estado a ${nuevoEstado}?`)) return;

                // Optimistic UI (actualizar visualmente antes de la DB)
                // Pero como tenemos Realtime funcionando bien ahora, podemos esperar o hacerlo.
                // Haremos la update en DB y el realtime actualizará la lista.
                
                await supabaseClient
                    .from('reservas')
                    .update({ estado: nuevoEstado })
                    .eq('id', reserva.id);
            },

            filter(type, el) {
                this.currentFilter = type;
                document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
                el.classList.add('active');
                this.renderList();
            },

            nav(target, el) {
                document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
                el.classList.add('active');

                // Ocultar todo
                document.getElementById('listView').classList.add('hidden');
                document.getElementById('chatViewList').classList.add('hidden');

                if (target === 'home') {
                    document.getElementById('listView').classList.remove('hidden');
                    this.renderList();
                } else if (target === 'chat') {
                    document.getElementById('chatViewList').classList.remove('hidden');
                    document.getElementById('msgNotify').style.display = 'none'; // Limpiar badge
                } else if (target === 'calendar') {
                    // Implementación futura de calendario visual
                    alert("Vista calendario en construcción");
                }
            },

            // --- PUSH NOTIFICATIONS ---
            async enablePush() {
                if (!this.swRegistration) return alert("Navegador no soporta SW");
                try {
                    const subscription = await this.swRegistration.pushManager.subscribe({
                        userVisibleOnly: true,
                        applicationServerKey: this.urlBase64ToUint8Array('BJbV1Q7w6qK...TU_CLAVE_VAPID_PUBLICA_AQUI...') // REEMPLAZAR SI TIENES VAPID
                    });

                    // Guardar en Supabase
                    await supabaseClient.from('admin_subscriptions').insert({
                        codigo_negocio: this.code,
                        subscription: subscription
                    });
                    
                    notifications.show('Push Activado', 'Recibirás alertas incluso cerrado.');
                    this.updateBtnUI();

                } catch (e) { 
                    console.error(e); 
                    // Fallback si no hay VAPID configurado, solo simulamos visualmente
                    alert("Para notificaciones Push reales, configura VAPID keys en enablePush()");
                }
            },

            async updateBtnUI() {
                if(!this.swRegistration) return;
                const subscription = await this.swRegistration.pushManager.getSubscription();
                if (subscription) {
                    this.btn.classList.add('active');
                    this.btn.querySelector('span').innerText = 'Activado';
                    this.btn.onclick = null;
                }
            },

            urlBase64ToUint8Array(base64String) {
                const padding = '='.repeat((4 - base64String.length % 4) % 4);
                const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
                const rawData = window.atob(base64);
                const outputArray = new Uint8Array(rawData.length);
                for (let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
                return outputArray;
            }
        };

        // Iniciar
        admin.init();
    </script>
</body>
</html>
